name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check (compile all)
        run: python -m compileall -q docx2pdf tests scripts launcher.py
      - name: Unit tests (stdlib unittest; COM backends mocked)
        run: python -m unittest discover -s tests -v
